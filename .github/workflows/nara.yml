name: nara (manual)

on:
  workflow_dispatch:            # Blue Book is a closed archive; rebuild only when NARA publishes a new export

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  nara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild Blue Book layer (downloads 90.8 MB NARA JSON + GeoNames at runtime, not committed)
        run: bash pipeline/run_nara.sh
      - name: Commit if data changed
        run: |
          git config user.name  "im-ufo-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-src docs/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "nara: Blue Book rebuild $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
