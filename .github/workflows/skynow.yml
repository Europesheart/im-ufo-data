name: skynow (every 2h)

on:
  schedule:
    - cron: "17 */2 * * *"      # every 2 hours at :17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit            # never two data jobs pushing at once
  cancel-in-progress: false

jobs:
  skynow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache key (CelesTrak asks for <= 1 download per 2 h)
        id: bucket
        run: echo "key=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 2 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/celestrak-starlink.json
          key: celestrak-${{ steps.bucket.outputs.key }}
          restore-keys: |
            celestrak-
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ll2-previous.json
            .cache/ll2-upcoming.json
            .cache/jpl-fireball.json
          key: skynow-feeds-${{ steps.bucket.outputs.key }}
          restore-keys: |
            skynow-feeds-
      - uses: actions/cache@v4
        with:
          path: .cache/de421.bsp
          key: de421-ephemeris
      - name: Build Sky Now
        run: bash pipeline/run_skynow.sh
      - name: Commit if data changed
        run: |
          git config user.name  "im-ufo-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "skynow: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
